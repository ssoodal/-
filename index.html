<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 뭐 먹지? 점심 메뉴 추첨기</title>

  <style>
    :root {
      --yellow: #ffe600;
      --green: #46b83f;
      --dark-green: #153f16;
      --olive: #7a7115;
      --black: #111111;
      --white: #ffffff;
      --soft: rgba(0, 0, 0, 0.12);
    }

    body.dark {
      --yellow: #1f1f12;
      --green: #62d85a;
      --dark-green: #eaffdf;
      --olive: #8d8421;
      --black: #fff9d7;
      --white: #252515;
      --soft: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, #ffe700 0 2%, transparent 8%),
        radial-gradient(circle at 80% 8%, #ffe700 0 2%, transparent 8%),
        linear-gradient(135deg, #134d18, #0f2f13 45%, #2f6b24);
      overflow-x: hidden;
      color: var(--black);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          100deg,
          rgba(255,255,255,0.08) 0px,
          rgba(255,255,255,0.08) 1px,
          transparent 1px,
          transparent 8px
        );
      opacity: 0.45;
      pointer-events: none;
    }

    .grass-flower {
      position: fixed;
      font-size: 64px;
      z-index: 0;
      filter: drop-shadow(0 8px 8px rgba(0,0,0,0.25));
      animation: float 4s ease-in-out infinite;
    }

    .flower1 { top: 24px; left: 32px; transform: rotate(-16deg); }
    .flower2 { top: 40px; right: 42px; transform: rotate(15deg); }
    .flower3 { bottom: 18px; right: 24px; transform: rotate(-10deg); }

    @keyframes float {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -8px; }
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 18px;
    }

    .phone {
      width: min(420px, 100%);
      min-height: 760px;
      background: var(--yellow);
      border: 8px solid #171717;
      border-radius: 44px;
      box-shadow:
        0 28px 60px rgba(0,0,0,0.45),
        inset 0 0 0 2px rgba(255,255,255,0.45);
      padding: 26px 22px 24px;
      position: relative;
      overflow: hidden;
      transform: rotate(-3deg);
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 13px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 30px;
      background: #111;
      border-radius: 999px;
      z-index: 3;
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 22px;
      position: relative;
      z-index: 4;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 68px;
    }

    .brand {
      font-size: 25px;
      font-weight: 950;
      letter-spacing: -1.5px;
      transform: skew(-8deg);
    }

    .menu-area {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pill {
      border: 1.5px solid var(--black);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 14px;
      font-weight: 700;
      background: transparent;
      color: var(--black);
    }

    .small-btn {
      border: none;
      background: var(--olive);
      color: white;
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .toggle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--olive);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      margin-top: 24px;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .tag {
      display: inline-block;
      border: 1.6px solid var(--black);
      border-radius: 999px;
      padding: 5px 13px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 52px;
      transform: rotate(5deg);
    }

    .food-emoji {
      font-size: 72px;
      line-height: 1;
      filter: drop-shadow(0 10px 8px rgba(0,0,0,0.18));
      margin-bottom: -10px;
    }

    .menu-name {
      font-size: clamp(42px, 13vw, 68px);
      line-height: 0.9;
      font-weight: 1000;
      letter-spacing: -4px;
      color: var(--black);
      text-transform: uppercase;
      word-break: keep-all;
      max-width: 100%;
    }

    .restaurant-name {
      margin-top: 24px;
      font-size: 22px;
      font-weight: 900;
      color: var(--dark-green);
      word-break: keep-all;
    }

    .sub-tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }

    .result-card {
      margin-top: 26px;
      background: rgba(255, 255, 255, 0.28);
      border: 1.5px solid rgba(0,0,0,0.12);
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 14px 35px rgba(0,0,0,0.15);
      backdrop-filter: blur(6px);
    }

    .hint {
      font-size: 14px;
      font-weight: 700;
      color: rgba(0,0,0,0.58);
      line-height: 1.5;
    }

    body.dark .hint {
      color: rgba(255,255,255,0.68);
    }

    .bottom {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 26px;
      display: grid;
      gap: 10px;
    }

    .bottom-row {
      display: flex;
      gap: 10px;
    }

    button {
      font-family: inherit;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .back-btn {
      flex: 0 0 auto;
      border: none;
      border-radius: 999px;
      background: var(--olive);
      color: white;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .draw-btn {
      flex: 1;
      border: none;
      border-radius: 999px;
      background: var(--green);
      color: #102d0f;
      padding: 15px 20px;
      font-size: 17px;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(30, 120, 20, 0.22);
    }

    .share-btn {
      border: 1.5px solid var(--black);
      border-radius: 999px;
      background: transparent;
      color: var(--black);
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 850;
      cursor: pointer;
    }

    .message {
      min-height: 20px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: rgba(0,0,0,0.62);
    }

    body.dark .message {
      color: rgba(255,255,255,0.75);
    }

    .spinning {
      animation: slotSpin 0.08s infinite alternate;
    }

    @keyframes slotSpin {
      from {
        transform: translateY(-4px) scale(0.96) rotate(-1deg);
        opacity: 0.7;
      }
      to {
        transform: translateY(4px) scale(1.04) rotate(1deg);
        opacity: 1;
      }
    }

    .burst {
      position: absolute;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255,255,255,0.8), transparent 60%);
      border-radius: 50%;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
    }

    .burst.on {
      animation: burst 0.6s ease-out;
    }

    @keyframes burst {
      0% {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(0.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2.4);
      }
    }

    @media (max-width: 480px) {
      .phone {
        min-height: 720px;
        border-radius: 36px;
        padding: 24px 18px;
        transform: none;
      }

      .brand-row {
        margin-bottom: 42px;
      }

      .brand {
        font-size: 22px;
      }

      .small-btn {
        padding: 8px 12px;
      }

      .hero {
        min-height: 330px;
      }

      .tag {
        margin-bottom: 40px;
      }

      .bottom {
        left: 18px;
        right: 18px;
      }

      .grass-flower {
        font-size: 44px;
      }
    }
  </style>
</head>

<body>
  <div class="grass-flower flower1">🌼</div>
  <div class="grass-flower flower2">🌼</div>
  <div class="grass-flower flower3">🌼</div>

  <main class="page">
    <section class="phone">
      <div class="burst" id="burst"></div>

      <div class="status">
        <span>9:41</span>
        <span>⌁ ︎▰</span>
      </div>

      <div class="brand-row">
        <div class="brand">LUNCHTURE</div>

        <div class="menu-area">
          <button class="small-btn" onclick="startDraw()">Menu ＋</button>
          <button class="toggle-btn" id="darkModeToggle" title="다크모드">◐</button>
        </div>
      </div>

      <div class="hero">
        <div class="tag">오늘의 점심 후보</div>

        <div class="food-emoji" id="foodIcon">🍽️</div>

        <div class="menu-name" id="menuText">
          오늘<br />뭐 먹지?
        </div>

        <div class="restaurant-name" id="restaurantText"></div>

        <div class="sub-tags">
          <span class="pill">랜덤 추첨</span>
          <span class="pill">점심메뉴</span>
        </div>

        <div class="result-card">
          <div class="hint" id="hintText">
            Google Sheets의 “점심메뉴” 시트에서<br />
            메뉴와 식당 이름을 불러옵니다.
          </div>
        </div>
      </div>

      <div class="bottom">
        <div class="bottom-row">
          <button class="back-btn" onclick="resetResult()">← Retouch</button>
          <button class="draw-btn" onclick="startDraw()">추첨 시작</button>
        </div>

        <button class="share-btn" onclick="copyResult()">결과 공유하기</button>
        <div class="message" id="shareMessage"></div>
      </div>
    </section>
  </main>

  <script>
    let menus = [];
    let selectedMenu = null;
    let isDrawing = false;

    const menuText = document.getElementById("menuText");
    const restaurantText = document.getElementById("restaurantText");
    const hintText = document.getElementById("hintText");
    const foodIcon = document.getElementById("foodIcon");
    const shareMessage = document.getElementById("shareMessage");
    const darkModeToggle = document.getElementById("darkModeToggle");
    const burst = document.getElementById("burst");

    const icons = ["🍜", "🍱", "🍛", "🍲", "🥘", "🍔", "🥗", "🍣", "🥟", "🍝", "🥪"];

    google.script.run
      .withSuccessHandler(function(data) {
        menus = data;

        if (!menus.length) {
          menuText.innerHTML = "메뉴가<br />없어요";
          restaurantText.textContent = "";
          hintText.innerHTML = "A열에는 메뉴명, B열에는 식당 이름을 입력해주세요.";
        } else {
          hintText.innerHTML = `${menus.length}개의 점심 후보를 불러왔어요.<br />이제 추첨을 시작해보세요.`;
        }
      })
      .withFailureHandler(function(error) {
        menuText.innerHTML = "불러오기<br />실패";
        restaurantText.textContent = "";
        hintText.textContent = error.message;
      })
      .getLunchMenus();

    function startDraw() {
      if (isDrawing) return;

      if (!menus.length) {
        shareMessage.textContent = "먼저 시트에 메뉴를 입력해주세요.";
        return;
      }

      isDrawing = true;
      shareMessage.textContent = "";
      hintText.textContent = "두근두근... 오늘의 점심을 고르는 중!";
      menuText.classList.add("spinning");

      let count = 0;
      const maxCount = 28;

      const interval = setInterval(function() {
        const item = menus[Math.floor(Math.random() * menus.length)];
        const icon = icons[Math.floor(Math.random() * icons.length)];

        foodIcon.textContent = icon;
        menuText.textContent = item.menu;
        restaurantText.textContent = item.restaurant;

        count++;

        if (count >= maxCount) {
          clearInterval(interval);

          selectedMenu = menus[Math.floor(Math.random() * menus.length)];

          foodIcon.textContent = "🌼";
          menuText.textContent = selectedMenu.menu;
          restaurantText.textContent = selectedMenu.restaurant;
          hintText.textContent = "오늘의 점심 메뉴가 정해졌어요!";
          menuText.classList.remove("spinning");

          burst.classList.remove("on");
          void burst.offsetWidth;
          burst.classList.add("on");

          isDrawing = false;
        }
      }, 75);
    }

    function resetResult() {
      selectedMenu = null;
      foodIcon.textContent = "🍽️";
      menuText.innerHTML = "오늘<br />뭐 먹지?";
      restaurantText.textContent = "";
      hintText.innerHTML = menus.length
        ? `${menus.length}개의 점심 후보를 불러왔어요.<br />다시 추첨해보세요.`
        : "Google Sheets의 “점심메뉴” 시트에서 메뉴를 불러옵니다.";
      shareMessage.textContent = "";
    }

    function copyResult() {
      if (!selectedMenu) {
        shareMessage.textContent = "먼저 메뉴를 추첨해주세요.";
        return;
      }

      const text = `오늘의 점심 메뉴는 ${selectedMenu.restaurant}의 ${selectedMenu.menu}!`;

      navigator.clipboard.writeText(text)
        .then(function() {
          shareMessage.textContent = "결과가 복사되었어요.";
        })
        .catch(function() {
          shareMessage.textContent = text;
        });
    }

    darkModeToggle.addEventListener("click", function() {
      document.body.classList.toggle("dark");
    });
  </script>
</body>
</html>
